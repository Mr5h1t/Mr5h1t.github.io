short_bio: >-
  <p>
  I am Yixiang Sun (孙一翔), an incoming master's student in Electronic Information
  at the School of Computer Science, China University of Geosciences (Wuhan), where
  I will be conducting research under the supervision of
  <a href="https://grzy.cug.edu.cn/ZhengLiu/zh_CN/index.htm" target="_blank">Associate Researcher Zheng Liu</a>
  on differentiable meshing for neural 3D reconstruction and geometry processing.
  </p>

  <p>
  I grew up in <a href="https://en.wikipedia.org/wiki/Nanchang" target="_blank">Nanchang, Jiangxi, China</a>.
  I spent my most memorable time at
  <a href="https://baike.baidu.com/item/%E5%8D%97%E6%98%8C%E5%B8%82%E7%AC%AC%E4%BA%8C%E4%B8%AD%E5%AD%A6" target="_blank">Nanchang No. 2 Middle School</a>
  (entered in 2019), where I made some truly great friends. Outside of research,
  I enjoy playing basketball, traveling, and exploring anime, manga, and games.
  </p>
