short_bio: >-
  <p>
   I will join the School of Computer Science at China University of
  Geosciences (Wuhan) as a master's student in Electronic Information
  in September 2026. I received my B.Eng. degree in Virtual Reality
  Technology from Jiangxi University of Finance and Economics in 2026.
  My current research interest is differentiable meshing.
  </p>
  
  <p>
  I grew up in <a href="https://en.wikipedia.org/wiki/Nanchang" target="_blank">Nanchang, Jiangxi, China</a>.
  I spent my most memorable time at
  <a href="https://baike.baidu.com/item/%E5%8D%97%E6%98%8C%E5%B8%82%E7%AC%AC%E4%BA%8C%E4%B8%AD%E5%AD%A6" target="_blank">Nanchang No. 2 Middle School</a>
  (class of 2022), where I made some truly great friends.
  </p>

